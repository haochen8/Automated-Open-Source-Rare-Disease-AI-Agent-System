name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=rare_disease_agent --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/privacy_guard.py --all
      - run: python -m pip check
      - run: python -m hatchling build
      - run: git diff --check
