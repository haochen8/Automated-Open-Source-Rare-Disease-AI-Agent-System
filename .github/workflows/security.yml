name: privacy

on:
  push:
  pull_request:

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'pydantic>=2.10,<3'
      - run: python scripts/privacy_guard.py --all
